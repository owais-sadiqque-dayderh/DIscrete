name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS: capture, OCR and Bubble import pyobjc frameworks that only exist there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Lint (ruff)
        run: .venv/bin/ruff check discrete tools tests
      - name: Type check (pyright)
        run: .venv/bin/pyright
      - name: Tests (no live screen on CI)
        run: .venv/bin/python -m pytest -q -m "not display"
