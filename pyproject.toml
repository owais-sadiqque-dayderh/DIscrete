[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discrete"
version = "0.1.0"
description = "DIscrete: a user model built from screen activity (planS1-3)."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "mss>=9.0",
    "imagehash>=4.3",
    "datasketch>=1.6",
    "rapidfuzz>=3.0",
    "dateparser>=1.2",
    "ranx>=0.3",
    "tldextract>=5.0",
    "PyYAML>=6.0",
    "pynput>=1.7",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "pyright>=1.1.380"]

[project.scripts]
discrete = "discrete.cli:main"

[tool.setuptools.packages.find]
include = ["discrete*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "display: needs a logged-in macOS session with a real screen (skip on CI with -m 'not display')",
]

[tool.ruff]
line-length = 135
target-version = "py311"
extend-exclude = [".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = [
    "E731",  # small lambdas assigned to names are used deliberately
    "B008",  # dataclass field defaults
]

[tool.ruff.lint.per-file-ignores]
"discrete/*/prompts.py" = ["E501"]  # model prompts: line breaks would change the text sent

[tool.ruff.lint.isort]
known-first-party = ["discrete"]

[tool.pyright]
include = ["discrete", "tools"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingModuleSource = false
# pyobjc ships no type stubs; its frameworks resolve at runtime only.
reportAttributeAccessIssue = "warning"
