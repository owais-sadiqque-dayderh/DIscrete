[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discrete"
version = "0.1.0"
description = "DIscrete: a user model built from screen activity (planS1-3)."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "mss>=9.0",
    "imagehash>=4.3",
    "datasketch>=1.6",
    "rapidfuzz>=3.0",
    "dateparser>=1.2",
    "ranx>=0.3",
    "tldextract>=5.0",
    "PyYAML>=6.0",
    "pynput>=1.7",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
discrete = "discrete.cli:main"

[tool.setuptools.packages.find]
include = ["discrete*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
